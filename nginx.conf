# ── nginx reverse proxy for Gabimaru Bot on Pterodactyl ─────────────────────
#
# SETUP STEPS (run as root on the host node):
#   1. apt install -y nginx
#   2. Copy this file to /etc/nginx/sites-available/gabimaru
#   3. ln -s /etc/nginx/sites-available/gabimaru /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# Replace:
#   YOUR_DOMAIN   → your domain or server IP (e.g. bot.example.com)
#   CONTAINER_IP  → the container's internal IP shown in Pterodactyl
#                   (usually 172.18.x.x — check "Network" tab in the panel)
#   2010          → match the PORT in your bot's environment variable
#
# If you have a domain + Certbot:
#   certbot --nginx -d YOUR_DOMAIN
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Optional: redirect HTTP → HTTPS after you add SSL via Certbot
    # return 301 https://$host$request_uri;

    # ── Proxy all traffic to the bot's Express server ─────────────────────────
    location / {
        proxy_pass         http://CONTAINER_IP:2010;
        proxy_http_version 1.1;

        # WebSocket support (Baileys uses WS internally)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Forwarded headers so Express "trust proxy" works correctly
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — pairing can take up to 30s
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        # Buffer settings
        proxy_buffering    off;
        client_max_body_size 50M;
    }
}

